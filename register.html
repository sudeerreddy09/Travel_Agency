<!DOCTYPE html>
<html>

<head>
    <title>Blue Bee Tours - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1 align="center">🐝 Blue Bee Tours</h1>

    <hr>

    <h2 align="center">Register</h2>

    <form id="registerForm" align="center">

        <label>Full Name</label><br>
        <input type="text" id="name" placeholder="Enter your name">

        <br><br>

        <label>Email</label><br>
        <input type="email" id="email" placeholder="Enter your email">

        <br><br>

        <label>Phone Number</label><br>
        <input type="tel" id="phone" placeholder="Enter phone number">

        <br><br>

        <label>Password</label><br>
        <input type="password" id="password" placeholder="Enter password">

        <br><br>

        <label>Confirm Password</label><br>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
        <label>
        <input type="checkbox" id="showRegisterPassword">
        </label>

        <br><br>

        <label>Gender</label><br><br>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <input type="checkbox" id="terms">
        <label for="terms">I agree to the Terms &amp; Conditions</label>

        <br><br>

        <button type="submit">Register</button>

    </form>

    <br>

    <p align="center">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <p align="center">
        <a href="index.html">Back to Home</a>
    </p>
    <script src="js/script.js"></script>

</body>

</html>
