<!DOCTYPE html>
<html>

<head>
    <title>Blue Bee Tours - Login</title>

    <style>

        body{
            margin:0;
            background:#f2f2f2;
            font-family:Arial;

            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            width:350px;
        }

        h1{
            text-align:center;
            color:blue;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:darkblue;
        }

        p{
            text-align:center;
        }

        a{
            text-decoration:none;
            color:blue;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🐝 Blue Bee Tours</h1>

    <h2>Login</h2>

    <form>

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

    <p>
        <a href="#">Forgot Password?</a>
    </p>

    <p>
        <a href="index.html">Back to Home</a>
    </p>

</div>

</body>

</html>
